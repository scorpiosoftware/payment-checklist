<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF1EF;
    --surface: #FFFFFF;
    --ink: #1D2A2F;
    --muted: #5E6E6A;
    --line: #D3DCD8;
    --paid: #2E7D5B;
    --paid-soft: #DCEFE5;
    --pending: #A86A12;
    --pending-soft: #F7EAD3;
    --danger: #B3402E;
    --focus: #2D6FB0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141B1D; --surface: #1D2629; --ink: #E6ECEA; --muted: #9AAAA5; --line: #2F3B3E;
      --paid: #5BC08F; --paid-soft: #1E3A2E; --pending: #E0A549; --pending-soft: #3A2E1A;
      --danger: #E07A68; --focus: #6FA8E0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141B1D; --surface: #1D2629; --ink: #E6ECEA; --muted: #9AAAA5; --line: #2F3B3E;
    --paid: #5BC08F; --paid-soft: #1E3A2E; --pending: #E0A549; --pending-soft: #3A2E1A;
    --danger: #E07A68; --focus: #6FA8E0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

  h1 {
    font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 1.5rem;
  }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 2rem; }
  .total { padding: 0.9rem 1rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .total span { display: block; font-size: 0.85rem; color: var(--muted); }
  .total strong {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .total.paid strong { color: var(--paid); }
  .total.pending strong { color: var(--pending); }

  form {
    display: grid;
    grid-template-columns: 1.2fr 2fr 1fr;
    gap: 0.6rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    margin-bottom: 1.5rem;
  }
  label { font-size: 0.85rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.25rem; }
  input, select {
    font: inherit; color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem 0.7rem;
    width: 100%;
  }
  .form-foot { grid-column: 1 / -1; display: flex; gap: 0.6rem; align-items: end; justify-content: space-between; flex-wrap: wrap; }
  .status-pick { display: flex; gap: 0.4rem; }
  .status-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .status-pick label {
    flex-direction: row; align-items: center; cursor: pointer;
    padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink); font-size: 0.95rem;
  }
  .status-pick input:checked + label.p-pending { background: var(--pending-soft); border-color: var(--pending); color: var(--pending); }
  .status-pick input:checked + label.p-paid { background: var(--paid-soft); border-color: var(--paid); color: var(--paid); }
  .status-pick input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }

  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .add { background: var(--ink); color: var(--bg); padding: 0.65rem 1.4rem; font-weight: 600; }
  .error { grid-column: 1 / -1; color: var(--danger); font-size: 0.9rem; margin: 0; min-height: 0; }
  .error:empty { display: none; }

  .filters { display: flex; gap: 0.3rem; margin-bottom: 0.75rem; }
  .filters button { background: transparent; color: var(--muted); padding: 0.4rem 0.8rem; font-weight: 500; }
  .filters button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 0.9rem;
    align-items: center;
    padding: 0.9rem 0.25rem;
    border-bottom: 1px solid var(--line);
  }
  .check {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--pending); background: transparent;
    display: grid; place-items: center; padding: 0;
  }
  li.is-paid .check { background: var(--paid); border-color: var(--paid); }
  .check svg { width: 14px; height: 14px; opacity: 0; }
  li.is-paid .check svg { opacity: 1; }
  .name { font-weight: 600; }
  li.is-paid .name { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
  .desc { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
  .right { text-align: right; }
  .amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-block; font-size: 0.78rem; padding: 0.1rem 0.55rem; border-radius: 999px; margin-top: 0.2rem; }
  .badge.pending { background: var(--pending-soft); color: var(--pending); }
  .badge.paid { background: var(--paid-soft); color: var(--paid); }
  .del { background: transparent; color: var(--muted); padding: 0.35rem 0.5rem; font-size: 0.9rem; }
  .del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
  .clear { display: block; margin: 1.5rem auto 0; background: transparent; color: var(--muted); font-size: 0.9rem; text-decoration: underline; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 600px) {
    form { grid-template-columns: 1fr; }
    .totals { grid-template-columns: 1fr 1fr; }
    .totals .total:first-child { grid-column: 1 / -1; }
    li { grid-template-columns: auto 1fr auto; }
    .del { grid-column: 2 / -1; justify-self: start; padding-left: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>Payment checklist</h1>

  <section class="totals" aria-live="polite">
    <div class="total"><span>Total</span><strong id="tAll">0.00</strong></div>
    <div class="total paid"><span>Paid</span><strong id="tPaid">0.00</strong></div>
    <div class="total pending"><span>Pending</span><strong id="tPending">0.00</strong></div>
  </section>

  <form id="form" novalidate>
    <label>Name<input id="name" type="text" placeholder="e.g. Electricity bill" autocomplete="off"></label>
    <label>Description<input id="desc" type="text" placeholder="Optional details" autocomplete="off"></label>
    <label>Amount<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></label>
    <p class="error" id="error"></p>
    <div class="form-foot">
      <div class="status-pick" role="radiogroup" aria-label="Status">
        <input type="radio" name="status" id="sPending" value="pending" checked>
        <label for="sPending" class="p-pending">Pending</label>
        <input type="radio" name="status" id="sPaid" value="paid">
        <label for="sPaid" class="p-paid">Paid</label>
      </div>
      <button type="submit" class="add">Add item</button>
    </div>
  </form>

  <div class="filters" role="group" aria-label="Filter">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
    <button type="button" data-filter="paid" aria-pressed="false">Paid</button>
  </div>

  <ul id="list"></ul>
  <button type="button" class="clear" id="clearPaid" hidden>Remove all paid items</button>
</main>

<script>
  const KEY = "payment-checklist-items";
  let items = load();
  let filter = "all";

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  const fmt = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function render() {
    const list = document.getElementById("list");
    const shown = items.filter(i => filter === "all" || i.status === filter);

    if (!shown.length) {
      list.innerHTML = `<li class="empty" style="display:block;border:none">${
        items.length ? "Nothing here with this status." : "No items yet. Add your first one above."
      }</li>`;
    } else {
      list.innerHTML = shown.map(i => `
        <li class="${i.status === "paid" ? "is-paid" : ""}" data-id="${i.id}">
          <button class="check" data-act="toggle" aria-label="Mark ${esc(i.name)} as ${i.status === "paid" ? "pending" : "paid"}">
            <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
          </button>
          <div>
            <div class="name">${esc(i.name)}</div>
            ${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ""}
          </div>
          <div class="right">
            <div class="amount">${fmt(i.amount)}</div>
            <span class="badge ${i.status}">${i.status === "paid" ? "Paid" : "Pending"}</span>
          </div>
          <button class="del" data-act="delete" aria-label="Delete ${esc(i.name)}">Delete</button>
        </li>`).join("");
    }

    const sum = s => items.filter(i => !s || i.status === s).reduce((a, i) => a + Number(i.amount), 0);
    document.getElementById("tAll").textContent = fmt(sum());
    document.getElementById("tPaid").textContent = fmt(sum("paid"));
    document.getElementById("tPending").textContent = fmt(sum("pending"));
    document.getElementById("clearPaid").hidden = !items.some(i => i.status === "paid");
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const amountRaw = document.getElementById("amount").value;
    const status = document.querySelector('input[name="status"]:checked').value;
    const err = document.getElementById("error");

    if (!name) { err.textContent = "Enter a name for this item."; document.getElementById("name").focus(); return; }
    if (amountRaw === "" || isNaN(amountRaw) || Number(amountRaw) < 0) {
      err.textContent = "Enter an amount of 0 or more."; document.getElementById("amount").focus(); return;
    }
    err.textContent = "";

    items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, desc, amount: Number(amountRaw), status });
    save(); render();
    e.target.reset();
    document.getElementById("sPending").checked = true;
    document.getElementById("name").focus();
  });

  document.getElementById("list").addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.closest("li").dataset.id;
    if (btn.dataset.act === "toggle") {
      const it = items.find(i => i.id === id);
      it.status = it.status === "paid" ? "pending" : "paid";
    } else if (btn.dataset.act === "delete") {
      items = items.filter(i => i.id !== id);
    }
    save(); render();
  });

  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  }));

  document.getElementById("clearPaid").addEventListener("click", () => {
    if (confirm("Remove all paid items?")) { items = items.filter(i => i.status !== "paid"); save(); render(); }
  });

  render();
</script>
</body>
</html>
